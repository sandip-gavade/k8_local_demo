# Loki in single-binary mode with local filesystem storage: the smallest footprint, fine for a demo.
# Production would use microservices/simple-scalable mode with S3 (chunks + index) and retention.
deploymentMode: SingleBinary
loki:
  auth_enabled: false             # single tenant
  commonConfig: {replication_factor: 1}
  storage: {type: filesystem}
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: loki_index_, period: 24h}
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
  pattern_ingester: {enabled: false}
singleBinary:
  replicas: 1
  # /var/loki must be a writable volume (root fs is read-only). Small PVC on kind's default StorageClass.
  persistence: {enabled: true, size: 2Gi}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}
# Scale-out components off (single binary does everything).
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
gateway: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
sidecar: {rules: {enabled: false}}
