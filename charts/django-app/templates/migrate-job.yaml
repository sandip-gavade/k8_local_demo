{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "django-app.fullname" . }}-migrate
  labels: {{- include "django-app.labels" . | nindent 4 }}
  annotations:
    # Runs BEFORE the new pods exist. If it fails, `helm upgrade --atomic` rolls the release back.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels: {{- include "django-app.selectorLabels" (dict "ctx" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      # Hooks run BEFORE the chart's own ServiceAccount exists, so use the namespace default SA
      # and drop its API token (the job never talks to the K8s API).
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "django-app.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "manage.py", "migrate", "--noinput"]
          # Hooks run before the chart's ConfigMap exists, so config is inlined here from the same values.
          env:
            {{- range $k, $v := .Values.config }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
            {{- include "django-app.secretEnv" . | nindent 12 }}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 256Mi}}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
{{- end }}
