{{- if .Values.observability.enabled }}
# Tells Prometheus to scrape GET /metrics on every pod behind the web Service.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "django-app.fullname" . }}-web
  labels: {{- include "django-app.labels" . | nindent 4 }}
    release: {{ .Values.observability.releaseLabel }}
spec:
  selector:
    matchLabels: {{- include "django-app.selectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  namespaceSelector:
    matchNames: [{{ .Release.Namespace }}]
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.observability.scrapeInterval }}
{{- end }}
