{{- if .Values.secret.create }}
# Test-only path. Prefer a pre-existing Secret / External Secrets Operator in real environments.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "django-app.secretName" . }}
  labels: {{- include "django-app.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
