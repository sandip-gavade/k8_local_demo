{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "django-app.fullname" . }}
  labels: {{- include "django-app.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          # Longest prefix wins: /api -> Django (incl. /api/docs Swagger), everything else -> React.
          - path: /api
            pathType: Prefix
            backend: {service: {name: {{ include "django-app.fullname" . }}-web, port: {number: {{ .Values.web.port }}}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ include "django-app.fullname" . }}-frontend, port: {number: {{ .Values.frontend.port }}}}}
{{- end }}
